# Candidate server-scope include only. Preserve all existing locations and the generic /app-api/ 404.
# Install only after reviewed compatible JAR, migration gate=0 and staged checks.
location = /app-api/print/miniapp/demo/photo-upload-sessions {
    if ($request_method != POST) { return 405; }
    limit_except POST { deny all; }
    access_log off;
    # $uri is Nginx-normalized; the original path must already be canonical, with no query.
    if ($request_uri != $uri) { return 400; }
    if ($http_transfer_encoding != "") { return 400; }
    if ($http_content_encoding != "") { return 415; }
    if ($http_authorization !~ "^Bearer [A-Za-z0-9_-]{43}$") { return 401; }
    limit_req zone=print_photo_6in_rate burst=35 nodelay;
    limit_req_status 429;
    client_body_temp_path /var/lib/nginx/print-photo-6in-body 1 2;
    client_body_buffer_size 16k;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_send_timeout 20s;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_pass http://127.0.0.1:48080;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Origin $http_origin;
    proxy_set_header Referer $http_referer;
    proxy_set_header Idempotency-Key $http_idempotency_key;
    add_header Cache-Control "no-store" always;
    add_header Pragma "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    if ($http_content_length !~ "^[1-9][0-9]*$") { return 411; }
    if ($http_content_type !~* "^application/json(?:;|$)") { return 415; }
    if ($http_idempotency_key !~ "^[!-~]{1,128}$") { return 400; }
    client_max_body_size 2k;
    client_body_timeout 5s;
    proxy_request_buffering on;
    proxy_read_timeout 15s;
}

