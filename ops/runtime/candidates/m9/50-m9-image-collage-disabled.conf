[Service]
Environment="SPRING_SERVLET_MULTIPART_ENABLED=true"
Environment="SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE=16MB"
Environment="SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE=32MB"
Environment="SPRING_SERVLET_MULTIPART_FILE_SIZE_THRESHOLD=0B"
Environment="SPRING_SERVLET_MULTIPART_LOCATION=/home/ubuntu/print-system/runtime/miniapp-demo-multipart"
Environment="PRINT_MINIAPP_DEMO_MULTIPART_ROOT=/home/ubuntu/print-system/runtime/miniapp-demo-multipart"
Environment="PRINT_MINIAPP_DEMO_IMAGE_COLLAGE_ENABLED=false"
