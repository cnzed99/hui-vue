# Include in the existing print-system server block. Generic /app-api/ remains unchanged.
location = /app-api/print/miniapp-demo/archive-inspections {
    if ($request_method != POST) { return 405; }
    if ($http_content_length = "") { return 411; }
    if ($http_transfer_encoding != "") { return 400; }
    limit_conn print_archive_global 2;
    limit_conn print_archive_ip 2;
    limit_conn_status 429;
    client_max_body_size 2100k;
    client_body_timeout 15s;
    client_body_temp_path /var/lib/nginx/print-miniapp-archive-body 1 2;
    proxy_request_buffering on;
    proxy_connect_timeout 3s;
    proxy_send_timeout 20s;
    proxy_read_timeout 25s;
    proxy_pass http://127.0.0.1:48080;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Origin $http_origin;
    proxy_set_header Referer $http_referer;
    add_header Cache-Control "no-store" always;
    add_header Pragma "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
}
